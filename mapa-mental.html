}

// ===========================================================================
//  Layout — árvore horizontal, ancorada no PAI (filhos se distribuem em volta
//  do centro do pai, não o contrário), colunas alinhadas por profundidade
// ===========================================================================
const POS = new Map();   // id -> {x,y} visual atual do nó (base das animações)
// posição EM REPOUSO: left/top arredondado (seta nítida) e sem transform residual.
// Durante a animação os nós NÃO usam left/top — usam transform (ver frame()) p/ o texto
// não "chiar"/tremer (transform é composto pela GPU, o glifo é rasterizado uma vez só).
function place(id, x, y){
  const el = els.get(id); if(!el) return;
  x = Math.round(x); y = Math.round(y);
  el.style.transform = '';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  POS.set(id, { x, y });
}
// um segmento de conector: sai do círculo da seta do pai (px+pw+18) até a esquerda do filho
function linkSeg(px, pw, py, ph, cx, cy, ch){
  const x1 = px + pw + 18, y1 = py + ph/2, x2 = cx, y2 = cy + ch/2, dx = x2 - x1;
  return 'M' + x1 + ',' + y1 + ' C' + (x1+dx*0.5) + ',' + y1 + ' ' + (x2-dx*0.5) + ',' + y2 + ' ' + x2 + ',' + y2;
}
// desenha os conectores agrupados por nível do filho (um <path> por nível → cor por nível).
// posOf(id) -> {x,y,w,h} (permite interpolar durante a animação)
function drawLinks(posOf, extra){
  const byLvl = [[],[],[],[],[]];   // índice = nível do filho − 1 (clamp em 5)
  LAYOUT.forEach((it, id) => {
    if(!it.parent) return;
    const p = posOf(it.parent.id), c = posOf(id);
    if(!p || !c) return;
    const lvl = Math.min(it.depth, 5);
    byLvl[lvl - 1].push(linkSeg(p.x, p.w, p.y, p.h, c.x, c.y, c.h));
  });
  if(extra) for(const e of extra) byLvl[Math.min(e.lvl, 5) - 1].push(e.seg);   // conectores dos nós que estão saindo
  for(let i = 0; i < 5; i++) if(LK[i]) LK[i].setAttribute('d', byLvl[i].join(' '));
}
function layout(){
  const list = visibleList();
  const byId = new Map(list.map(it => [it.id, it]));

  // --- 1. sincroniza o DOM ---
  const seen = new Set();
  for(const it of list){
    const { node, depth, id } = it;
    let el = els.get(id);
    if(!el){
      el = document.createElement('div');
      el.className = 'node';
      el.dataset.id = id;
      el.innerHTML = '<span class="lbl"></span>';
      world.appendChild(el);
      els.set(id, el);
      if(animateNext){
        el.classList.add('enter');
        el.addEventListener('animationend', () => el.classList.remove('enter'), { once:true });
      }
    }
    el.dataset.depth = Math.min(depth, 4);
    if(node.color) el.dataset.color = node.color; else el.removeAttribute('data-color');
    el.classList.toggle('selected', id === selectedId);
    if(id !== editingId) el.querySelector('.lbl').textContent = node.label || '​';
    el.classList.toggle('fixw', !!node.w);
    el.style.width = node.w ? node.w + 'px' : '';
    if(!el.querySelector('.rsz')) addResizeHandle(el, id);

    let tg = el.querySelector('.toggle');
    if(node.children.length){
      if(!tg){
        tg = document.createElement('button');
        tg.className = 'toggle'; tg.tabIndex = -1;
        tg.innerHTML = CHEVRON;
        tg.addEventListener('click', ev => {
          ev.stopPropagation();
          tg.classList.remove('pop'); void tg.offsetWidth; tg.classList.add('pop');
          tg.addEventListener('animationend', () => tg.classList.remove('pop'), { once:true });
          toggleCollapse(id);
        });
        tg.addEventListener('pointerdown', ev => ev.stopPropagation());
        el.appendChild(tg);
      }
      tg.dataset.open = node.collapsed ? '0' : '1';
      tg.title = node.collapsed ? 'Expandir' : 'Recolher';
    } else if(tg){ tg.remove(); }

    // ícone de referências (canto superior direito) — SÓ em nós que já têm refs;
    // aparece apenas no hover/seleção do nó (ver CSS). Adicionar a 1ª ref = botão do #actionbar.
    let rl = el.querySelector('.reflink');
    const nrefs = (node.refs && node.refs.length) || 0;
    if(nrefs > 0){
      if(!rl){
        rl = document.createElement('button');
        rl.className = 'reflink'; rl.tabIndex = -1;
        rl.innerHTML = LINK_ICON;
        rl.addEventListener('pointerdown', ev => ev.stopPropagation());
        rl.addEventListener('click', ev => { ev.stopPropagation(); openRefBox(id, rl); });
        el.appendChild(rl);
      }
      rl.title = nrefs + (nrefs > 1 ? ' referências' : ' referência');
    } else if(rl){ rl.remove(); }

    seen.add(id);
  }
  els.forEach((el, id) => { if(!seen.has(id)){ el.remove(); els.delete(id); POS.delete(id); } });
  animateNext = false;

  // --- 2. mede ---
  for(const it of list){
    const el = els.get(it.id);
    it.w = el.offsetWidth;
    it.h = el.offsetHeight;
  }

  // --- 3. largura de cada profundidade (maior nó do nível) — base do vão "natural" até os filhos ---
  const colW = [];
  for(const it of list) colW[it.depth] = Math.max(colW[it.depth] || 0, it.w);

  // --- 4. y — ancorado no pai ---
  // 4a. extensão vertical que cada subárvore ocupa (folga p/ centralizar os filhos)
  function ext(node){
    const it = byId.get(node.id);
    const kids = node.collapsed ? [] : node.children;
    if(!kids.length){ it.ext = it.h; return it.ext; }
    let sum = 0;
    for(const k of kids) sum += ext(k);
    sum += V_GAP * (kids.length - 1);
    it.ext = Math.max(it.h, sum);
    return it.ext;
  }
  // 4b. atribui y: o nó fica em `yc` (centro), e os filhos se distribuem em volta desse mesmo centro.
  //     x: o filho sai da BORDA DIREITA do pai (onde fica o ">") + um vão CLAMPADO em [H_GAP_MIN, H_GAP_MAX]
  //     — o vão "natural" seria o alinhamento por coluna (colW[depth] − pai.w + H_GAP); clampar evita
  //     conector minúsculo (pai muito largo) ou gigante (pai bem mais estreito que o vizinho da coluna).
  function ly(node, depth, yc, xLeft){
    const it = byId.get(node.id);
    it.x = xLeft;
    it.y = yc - it.h / 2;
    const kids = node.collapsed ? [] : node.children;
    if(!kids.length) return;
    const childX = it.x + it.w + clamp((colW[depth] || it.w) - it.w + H_GAP, H_GAP_MIN, H_GAP_MAX);
    let total = 0;
    for(const k of kids) total += byId.get(k.id).ext;
    total += V_GAP * (kids.length - 1);
    let top = yc - total / 2;
    for(const k of kids){
      const ke = byId.get(k.id).ext;
      ly(k, depth + 1, top + ke / 2, childX);
      top += ke + V_GAP;
    }
  }
  ext(tree);
  ly(tree, 0, byId.get(tree.id).ext / 2, 0);

  // 4c. ancoragem: mantém _anchorRef.id fixo em _anchorRef.y (o layout inteiro só translada).
  // Como o cálculo é afim em yc, deslocar todo mundo == recentralizar — é determinístico,
  // então um render() seguinte reproduz a mesma posição (sem "pulo").
  if(_anchorRef && byId.has(_anchorRef.id)){
    const dy = _anchorRef.y - byId.get(_anchorRef.id).y;
    if(dy) for(const it of list) it.y += dy;
  }

  // --- 5. aplica posições + conectores ---
  let maxX = 0, maxY = 0, minY = Infinity;
  for(const it of list){
    place(it.id, it.x, it.y);
    maxX = Math.max(maxX, it.x + it.w);
    maxY = Math.max(maxY, it.y + it.h);
    minY = Math.min(minY, it.y);
  }
  if(minY === Infinity) minY = 0;
  LAYOUT = byId;
  drawLinks(id => LAYOUT.get(id));
  $('links').setAttribute('width', maxX);
  $('links').setAttribute('height', maxY);
  return { maxX, maxY, minY };
}

function render(){
  closeRefBox();
  layout();
  world.style.setProperty('--enter-dur', Math.round(TWEEN_MS * 0.96) + 'ms');   // fade dos nós novos ~= tween padrão
  applyTransform();
  positionActionBar();
  $('mapSel').value = currentId;
}

// ---- animação: nós E conectores interpolados juntos, por rAF (perfeitamente em sincronia) ----
const REDUCE_MOTION = (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches);
const TWEEN_MS = 750;
const TWEEN_MS_ALL = 1200;   // expandir/recolher TUDO anima mais devagar (muita coisa mexendo de uma vez)
let _tween = null;
const _ease = u => 1 - Math.pow(1 - u, 3);   // easeOutCubic

function clearNodeTransforms(){
  LAYOUT.forEach((it, id) => { const el = els.get(id); if(el) el.style.transform = ''; });
}
function finishTween(){
  if(!_tween) return;
  cancelAnimationFrame(_tween.raf);
  panX = _tween.px1; panY = _tween.py1;
  if(_tween.pz1 != null) zoom = _tween.pz1;
  if(_tween.leaving) _tween.leaving.forEach(L => { L.el.remove(); POS.delete(L.id); });
  clearNodeTransforms();
  LAYOUT.forEach((it, id) => place(id, it.x, it.y));   // pousa em left/top arredondado
  applyTransform();
  drawLinks(id => LAYOUT.get(id));
  positionActionBar();
  _tween = null;
}

// muta a árvore, recomputa o layout e anima do estado visual atual até o novo.
// Os nós ficam parados em left/top (alvo) e o deslocamento vai num `transform: translate`
// interpolado — assim o texto não treme (a GPU move o glifo já rasterizado).
function transitionTo(mutate, camFn, ms){
  finishTween();
  const dur = ms || TWEEN_MS;
  const from = new Map(POS);          // onde os nós estão AGORA na tela
  const wasParent = new Map(), wasDepth = new Map();
  LAYOUT.forEach((it, id) => { wasParent.set(id, it.parent ? it.parent.id : null); wasDepth.set(id, it.depth); });
  const px0 = panX, py0 = panY, z0 = zoom;
  if(mutate) mutate();

  // nós que SAEM (visíveis agora, somem depois — ex.: recolher): tira do `els` p/ o layout()
  // não apagá-los, e depois anima cada um "voltando pra dentro" do ancestral que sobreviveu.
  const afterIds = new Set(visibleList().map(x => x.id));
  const leaving = [];
  for(const id of from.keys()){
    if(afterIds.has(id)) continue;
    let s = wasParent.get(id);
    while(s != null && !afterIds.has(s)) s = wasParent.get(s);
    const el = els.get(id);
    if(!el || s == null) continue;
    els.delete(id);
    el.style.pointerEvents = 'none';
    el.style.zIndex = '-1';              // fica POR TRÁS do pai (e dos demais) enquanto "entra" nele
    leaving.push({ id, el, sink: s, from: from.get(id), depth: wasDepth.get(id) || 1, h: el.offsetHeight || 0 });
  }

  layout();                            // LAYOUT = alvo; left/top já nos alvos; cria .enter nos novos
  world.style.setProperty('--enter-dur', Math.round(dur * 0.96) + 'ms');   // fade dos nós novos acompanha ESTA tween

  // revelação "empilhado atrás do pai → abre em leque": todo nó NOVO cujo pai já estava
  // na tela começa colado no lado direito do pai; a tween (transform + o fade do .enter) o abre até a coluna dele.
  LAYOUT.forEach((it, id) => {
    if(from.has(id) || !it.parent) return;
    const pa = from.get(it.parent.id); if(!pa) return;
    const pit = LAYOUT.get(it.parent.id);
    from.set(id, { x: pa.x + (pit ? pit.w : 0), y: pa.y + (pit ? pit.h / 2 : 0) - it.h / 2 });
  });

  // alvo dos que saem: encaixam a PONTA ESQUERDA na ponta esquerda do pai (empilham atrás dele, alinhados)
  leaving.forEach(L => {
    const p = LAYOUT.get(L.sink);
    L.tx = p ? p.x : L.from.x;
    L.ty = p ? p.y + p.h / 2 - L.h / 2 : L.from.y;
  });

  // alvo de câmera (opcional) — calculado DEPOIS do layout (depende do LAYOUT novo)
  let px1 = panX, py1 = panY, z1 = zoom;
  if(camFn){ const c = camFn(); if(c){ px1 = c.panX; py1 = c.panY; if(c.zoom != null) z1 = c.zoom; } }
  const camMoves = Math.abs(px1 - px0) > 0.5 || Math.abs(py1 - py0) > 0.5 || Math.abs(z1 - z0) > 0.001;

  // anti-"wobble": lerp independente de panX/panY/zoom faz o centro VAGAR durante o zoom-out
  // (o raiz sai do meio e volta). Em vez disso, interpola a POSIÇÃO NA TELA de um ponto fixo do
  // mundo (o que está sob o centro da viewport no início) + o zoom, e deriva o pan disso.
  const _vr  = viewport.getBoundingClientRect();
  const _ax  = (_vr.width / 2 - px0) / z0, _ay = (_vr.height / 2 - py0) / z0;
  const _s0x = _vr.width / 2, _s0y = _vr.height / 2;      // ponto começa no centro da tela
  const _s1x = px1 + _ax * z1, _s1y = py1 + _ay * z1;     // e termina onde a câmera-alvo o coloca

  if(REDUCE_MOTION){
    leaving.forEach(L => { L.el.remove(); POS.delete(L.id); });
    if(camMoves){ panX = px1; panY = py1; zoom = z1; applyTransform(); }
    positionActionBar(); return;
  }

  const t0 = performance.now();
  _tween = { raf: 0, px1, py1, pz1: z1, camMoves, leaving };
  function frame(now){
    if(!_tween) return;
    let t = (now - t0) / dur; if(t >= 1) t = 1;
    const k = _ease(t), inv = 1 - k;
    if(camMoves){
      const zc = z1 + (z0 - z1) * inv;
      const sx = _s1x + (_s0x - _s1x) * inv;
      const sy = _s1y + (_s0y - _s1y) * inv;
      zoom = zc;
      panX = sx - _ax * zc;
      panY = sy - _ay * zc;
      applyTransform();
    }
    // posição visual interpolada (p/ conectores e barra de ações)
    const at = id => {
      const b = LAYOUT.get(id); if(!b) return null;
      const a = from.get(id);
      if(!a || (Math.abs(a.x - b.x) < 1 && Math.abs(a.y - b.y) < 1)) return { x: b.x, y: b.y, w: b.w, h: b.h };
      return { x: b.x + (a.x - b.x) * inv, y: b.y + (a.y - b.y) * inv, w: b.w, h: b.h };
    };
    LAYOUT.forEach((it, id) => {
      const el = els.get(id); if(!el) return;
      const a = from.get(id);
      // nó novo, ou que quase não anda (< ~1px, ex.: a raiz): fica no alvo, sem transform → texto 100% estável
      if(!a || (Math.abs(a.x - it.x) < 1 && Math.abs(a.y - it.y) < 1)){
        el.style.transform = ''; POS.set(id, { x: it.x, y: it.y }); return;
      }
      const dx = (a.x - it.x) * inv, dy = (a.y - it.y) * inv;
      el.style.transform = (t >= 1) ? '' : 'translate(' + dx + 'px,' + dy + 'px)';
      POS.set(id, { x: it.x + dx, y: it.y + dy });
    });
    // nós "voltando pra dentro" do pai: convergem pro sink + fade, com o conector encolhendo junto
    let leavingSegs = null;
    if(_tween.leaving.length){
      leavingSegs = [];
      const fade = 1 - Math.max(0, t - 0.5) / 0.5;   // fica ~1 até a metade, some no fim (já atrás do pai)
      for(const L of _tween.leaving){
        const a = L.from;
        const x = L.tx + (a.x - L.tx) * inv, y = L.ty + (a.y - L.ty) * inv;
        // sem scale — a fonte não "encolhe"; o nó desliza inteiro pra trás do pai (z-index:-1) e some
        L.el.style.transform = 'translate(' + (x - a.x) + 'px,' + (y - a.y) + 'px)';
        L.el.style.opacity = String(fade);
        const sp = LAYOUT.get(L.sink);
        if(sp && x > sp.x + sp.w - 4)   // conector some quando o nó já encostou/entrou no pai
          leavingSegs.push({ lvl: Math.min(L.depth, 5), seg: linkSeg(sp.x, sp.w, sp.y, sp.h, x, y, L.h) });
      }
    }
    drawLinks(at, leavingSegs);
    positionActionBar();
    if(t < 1) _tween.raf = requestAnimationFrame(frame);
    else {
      if(camMoves){ panX = px1; panY = py1; zoom = z1; applyTransform(); }
      _tween.leaving.forEach(L => { L.el.remove(); POS.delete(L.id); });
      LAYOUT.forEach((it, id) => place(id, it.x, it.y)); drawLinks(id => LAYOUT.get(id)); _tween = null;
    }
  }
  _tween.raf = requestAnimationFrame(frame);
}

// ===========================================================================
//  Câmera
// ===========================================================================
function applyTransform(){
  world.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
}
function zoomAt(factor, cx, cy){
  finishTween();
  const nz = clamp(zoom * factor, 0.18, 3);
  const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
  zoom = nz;
  panX = cx - wx * zoom;
  panY = cy - wy * zoom;
  applyTransform(); positionActionBar();
}
function zoomBy(factor){
  const r = viewport.getBoundingClientRect();
  zoomAt(factor, r.width/2, r.height/2);
}
// ---- pinça (2 dedos) no mobile: zoom + pan juntos, o mundo "gruda" no meio dos dedos ----
function _twoPointers(){
  const it = pointers.values();
  return [it.next().value, it.next().value];
}
function pinchStart(){
  finishTween();
  if(pan){ pan = null; viewport.classList.remove('panning'); }
  if(cand){ abortDrag(); }
  const [a, b] = _twoPointers();
  const r = viewport.getBoundingClientRect();
  pinch = {
    d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    mx0: (a.x + b.x) / 2 - r.left,
    my0: (a.y + b.y) / 2 - r.top,
    z0: zoom, panX0: panX, panY0: panY, t0: performance.now()
  };
}
// duplo-toque de 2 dedos (só mobile) → zoom OUT suave mantendo o ponto tocado fixo
function twoFingerDblZoomOut(cx, cy){
  transitionTo(null, () => {
    const nz = clamp(zoom / 1.5, 0.18, 3);
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    return { zoom: nz, panX: cx - wx * nz, panY: cy - wy * nz };
  }, 320);
}
function pinchMove(){
  if(!pinch || pointers.size < 2) return;
  const [a, b] = _twoPointers();
  const r  = viewport.getBoundingClientRect();
  const d  = Math.hypot(a.x - b.x, a.y - b.y) || 1;
  const mx = (a.x + b.x) / 2 - r.left;
  const my = (a.y + b.y) / 2 - r.top;
  const z  = clamp(pinch.z0 * d / pinch.d0, 0.18, 3);
  const wx = (pinch.mx0 - pinch.panX0) / pinch.z0;   // ponto do mundo sob o meio dos dedos no início
  const wy = (pinch.my0 - pinch.panY0) / pinch.z0;
  zoom = z;
  panX = mx - wx * z;
  panY = my - wy * z;
  applyTransform(); positionActionBar();
}
function pinchEnd(){
  pinch = null;
  if(pointers.size === 1){            // sobrou 1 dedo → segue como pan, sem "pulo"
    const p = pointers.values().next().value;
    pan = { x:p.x, y:p.y, ox:panX, oy:panY, moved:true };
    viewport.classList.add('panning');
  }
}
// {panX,panY,zoom} p/ enquadrar a ÁRVORE INTEIRA (usa o LAYOUT já calculado). Base do fitView e do toggleAll animado.
function fitTarget(){
  const r = viewport.getBoundingClientRect();
  let maxX = 0, maxY = 0, minY = Infinity;
  LAYOUT.forEach(it => { maxX = Math.max(maxX, it.x + it.w); maxY = Math.max(maxY, it.y + it.h); minY = Math.min(minY, it.y); });
  if(minY === Infinity) minY = 0;
  // margem proporcional à viewport (antes era 70px fixos — comia ~1/3 da largura no celular)
  const padX = clamp(r.width  * 0.045, 14, 70);
  const padY = clamp(r.height * 0.07,  14, 70);
  // reserva o canto dos #controls (viewport larga = verticais à direita; estreita/baixa = deitados na base)
  const narrow   = r.width <= 640 || r.height <= 480;
  const reserveR = narrow ? 0  : 72;
  const reserveB = narrow ? 48 : 0;
  const TG = 32;                              // ">" de recolher: fica ~29px à direita da caixa do nó (+ borda); escala com o zoom
  const marginL = padX, marginR = padX + reserveR;
  const marginT = padY, marginB = padY + reserveB;
  const availW = r.width  - marginL - marginR;
  const availH = r.height - marginT - marginB;
  const spanY  = (maxY - minY) || 1;
  const effW   = maxX + TG;                   // largura do mapa CONTANDO o ">" do nó mais à direita
  const z = clamp(Math.min(availW / effW, availH / spanY), 0.18, 1.6);
  return {
    zoom: z,
    panX: marginL + (availW - effW  * z) / 2,   // centra a caixa que inclui o ">"
    panY: marginT + (availH - spanY * z) / 2 - minY * z
  };
}
function fitView(){
  finishTween();
  _anchorRef = null;                        // "ajustar à tela" volta ao layout natural (centralizado)
  layout();
  const t = fitTarget();
  zoom = t.zoom; panX = t.panX; panY = t.panY;
  applyTransform(); positionActionBar();
}
// zoom PADRÃO de foco: clicar em </> sempre leva a câmera pra este zoom (ou menos, se o alvo não couber)
const FOCUS_ZOOM = 1.5;
const FOCUS_ZOOM_MOBILE = 1.3;   // modo mobile (w<=640 || h<=480) usa um zoom de foco menor
// pan/zoom p/ enquadrar uma bbox de MUNDO {bx,by,bw,bh} no zoom-alvo (default FOCUS_ZOOM), com as margens do fitView.
// opts.exact = usa targetZ na marra (NÃO recua p/ caber); opts.anchorLeft = alinha bx na margem esquerda (transborda à direita);
// opts.topWhenTall = se a bbox não couber na altura, encosta o topo dela na margem de cima (1º filho no topo) em vez de centrar.
function frameBox(bx, by, bw, bh, targetZ, opts){
  opts = opts || {};
  const r = viewport.getBoundingClientRect();
  const padX = clamp(r.width  * 0.045, 14, 70);
  const padY = clamp(r.height * 0.07,  14, 70);
  const narrow = r.width <= 640 || r.height <= 480;
  const marginL = padX, marginR = padX + (narrow ? 0 : 72);
  const marginT = padY, marginB = padY + (narrow ? 48 : 0);
  const availW = r.width  - marginL - marginR;
  const availH = r.height - marginT - marginB;
  const fitZ = Math.min(availW / Math.max(bw, 1), availH / Math.max(bh, 1));
  const z = opts.exact ? clamp(targetZ || FOCUS_ZOOM, 0.18, 3)
                       : clamp(Math.min(targetZ || FOCUS_ZOOM, fitZ), 0.18, 3);
  const tall = opts.topWhenTall && bh * z > availH;
  return {
    zoom: z,
    panX: opts.anchorLeft ? (marginL - bx * z)
                          : (marginL + (availW - bw * z) / 2 - bx * z),
    panY: tall ? (marginT - by * z)
               : (marginT + (availH - bh * z) / 2 - by * z)
  };
}
function ensureVisible(id){
  layout();
  const it = LAYOUT.get(id); if(!it) return;
  const r = viewport.getBoundingClientRect();
  const m = 46;
  const sx = panX + it.x * zoom, sy = panY + it.y * zoom;
  const sw = it.w * zoom, sh = it.h * zoom;
  if(sx < m)                 panX += (m - sx);
  if(sx + sw > r.width - m)  panX -= (sx + sw - (r.width - m));
  if(sy < m)                 panY += (m - sy);
  if(sy + sh > r.height - m) panY -= (sy + sh - (r.height - m));
  applyTransform(); positionActionBar();
}

// ===========================================================================
//  Barra de ações
// ===========================================================================
function positionActionBar(){
  if(readOnly || selectedId == null || editingId != null){ bar.style.display = 'none'; return; }
  const lit = LAYOUT.get(selectedId);
  const pit = POS.get(selectedId) || lit;      // x/y acompanham a animação; w/h do layout
  if(!lit || !pit){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const _rb = bar.querySelector('[data-a="ref"]');
  if(_rb){
    const _c = findCtx(selectedId);
    const _n = _c && _c.node.refs && _c.node.refs.length;
    _rb.classList.toggle('on', !!_n);
    _rb.title = _n ? ('Referências (' + _n + ')') : 'Adicionar referência';
  }
  const r = viewport.getBoundingClientRect();
  const sx = r.left + panX + pit.x * zoom;
  const sy = r.top  + panY + pit.y * zoom;
  const sw = lit.w * zoom;
  bar.style.left = '0px'; bar.style.top = '0px';
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  let left = sx + sw/2 - bw/2;
  let top  = sy - bh - 10;
  if(top < r.top + 6) top = sy + lit.h * zoom + 10;
  left = clamp(left, r.left + 6, r.right - bw - 6);
  bar.style.left = left + 'px';
  bar.style.top  = top + 'px';
}
bar.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const a = b.dataset.a, sc = b.dataset.sc;
  if(sc){ setColor(selectedId, sc, { deep: e.shiftKey, siblings: e.altKey }); bar.querySelector('.sw').classList.remove('open'); return; }
  if(!selectedId) return;
  if(a === 'child')   addChild(selectedId);
  if(a === 'sibling') addSibling(selectedId);
  if(a === 'edit')    startEdit(selectedId);
  if(a === 'up')      moveSibling(selectedId, -1);
  if(a === 'down')    moveSibling(selectedId, +1);
  if(a === 'ref')   { bar.querySelector('.sw').classList.remove('open'); openRefBox(selectedId, b); }
  if(a === 'del')     removeNode(selectedId);
  if(a === 'color')   bar.querySelector('.sw').classList.toggle('open');
});

// prévia da cor: passar o mouse na bolinha pinta o balão selecionado; só o clique aplica
// Shift/Alt segurados = prévia do ramo / irmãos, igual ao clique
let _pvKey = null, _pvNodes = [];
function paintNode(n, c){
  const el = els.get(n.id); if(!el) return;
  if(c) el.dataset.color = c; else el.removeAttribute('data-color');
}
function previewColor(key, e){
  _pvNodes.forEach(n => paintNode(n, n.color));          // desfaz a prévia anterior
  _pvNodes = []; _pvKey = key || null;
  if(!key || selectedId == null) return;
  _pvNodes = colorTargets(selectedId, { deep: e.shiftKey, siblings: e.altKey });
  _pvNodes.forEach(n => paintNode(n, key === 'auto' ? null : key));
}
bar.addEventListener('mouseover', e => { const b = e.target.closest('[data-sc]'); if(b) previewColor(b.dataset.sc, e); });
bar.addEventListener('mouseout',  e => { if(e.target.closest('[data-sc]')) previewColor(null); });
['keydown','keyup'].forEach(t => document.addEventListener(t, e => {
  if(_pvKey && (e.key === 'Shift' || e.key === 'Alt')){ if(e.key === 'Alt') e.preventDefault(); previewColor(_pvKey, e); }
}));
// botões da barra não pegam foco (senão Shift/Alt depois do clique acende o outline de foco)
bar.addEventListener('pointerdown', e => { if(e.target.closest('button')) e.preventDefault(); });

// ===========================================================================
//  Edição de texto
// ===========================================================================
// alça na borda direita: arrastar fixa a largura (node.w); duplo-clique volta ao automático
function addResizeHandle(el, id){
  const h = document.createElement('div');
  h.className = 'rsz'; h.title = 'Arraste p/ ajustar a largura · duplo-clique = automática';
  h.addEventListener('pointerdown', ev => {
    ev.stopPropagation(); ev.preventDefault();
    if(readOnly) return;
    finishTween();
    const ctx = findCtx(id); if(!ctx) return;
    const x0 = ev.clientX, w0 = el.offsetWidth;
    h.setPointerCapture(ev.pointerId);
    const move = e => {
      ctx.node.w = Math.round(Math.max(60, w0 + (e.clientX - x0) / zoom));
      const ta = el.querySelector('textarea.edit');
      layout(); if(ta){ autoGrow(ta); layout(); }
      positionActionBar();
    };
    const up = () => {
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
      snapshot();
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
  h.addEventListener('dblclick', ev => {
    ev.stopPropagation();
    const ctx = findCtx(id); if(readOnly || !ctx || !ctx.node.w) return;
    delete ctx.node.w; snapshot(); render(); positionActionBar();
  });
  el.appendChild(h);
}

// cresce a caixa de edição no tamanho exato do texto (largura E altura), sem soft-wrap
function autoGrow(ta){
  if(ta.closest('.fixw')){           // largura fixa: ocupa a largura do balão e quebra sozinho
    ta.style.width = '100%'; ta.style.height = '0px';
    ta.style.height = ta.scrollHeight + 'px';
    return;
  }
  ta.style.width = '0px'; ta.style.height = '0px';
  ta.style.width  = Math.max(120, Math.min(ta.scrollWidth + 2, 1000)) + 'px';
  ta.style.height = ta.scrollHeight + 'px';
}

function startEdit(id){
  if(readOnly) return;
  if(editingId === id) return;
  if(editingId != null) commitEdit(false);
  const ctx = findCtx(id); if(!ctx) return;
  editingId = id; selectedId = id;
  const el = els.get(id);
  el.querySelector('.lbl').style.display = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'edit';
  ta.value = ctx.node.label;
  ta.wrap = ctx.node.w ? 'soft' : 'off';
  el.appendChild(ta);
  autoGrow(ta);
  ta.focus(); ta.select();
  // reflow ao digitar: o balão cresce e empurra os vizinhos na hora (antes só ao confirmar)
  ta.addEventListener('input', () => { autoGrow(ta); layout(); positionActionBar(); });
  ta.addEventListener('pointerdown', ev => ev.stopPropagation());
  ta.addEventListener('keydown', onEditKey);
  ta.addEventListener('blur', () => { if(editingId === id) commitEdit(false); });
  positionActionBar();
}
function onEditKey(e){
  if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
  else if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commitEdit(false); }   // só confirma; não cria nada
  else if(e.key === 'Tab'){ e.preventDefault(); commitEdit('child'); }
  e.stopPropagation();
}
function finishEditDOM(id){
  const el = els.get(id); if(!el) return;
  const ta = el.querySelector('textarea.edit'); if(ta) ta.remove();
  const lbl = el.querySelector('.lbl'); if(lbl) lbl.style.display = '';
}
function cancelEdit(){
  if(editingId == null) return;
  const id = editingId; editingId = null;
  finishEditDOM(id);
  if(id === pendingNewId){
    const ctx = findCtx(id);
    if(ctx && ctx.parent){
      ctx.parent.children.splice(ctx.index, 1);
      selectedId = ctx.parent.id;
    }
    pendingNewId = null;
  }
  render(); positionActionBar();
}
function commitEdit(then){
  if(editingId == null) return;
  const id = editingId;
  const el = els.get(id);
  const ta = el ? el.querySelector('textarea.edit') : null;
  const val = (ta ? ta.value : '').replace(/\s+$/,'');
  const ctx = findCtx(id);
  editingId = null;
  finishEditDOM(id);

  if(!val && id === pendingNewId){          // nó recém-criado deixado vazio → descarta
    if(ctx && ctx.parent){
      ctx.parent.children.splice(ctx.index, 1);
      selectedId = ctx.parent.id;
    }
    pendingNewId = null;
    render(); positionActionBar();
    return;
  }
  let changed = false;
  if(ctx){
    const finalVal = val || ctx.node.label || '(vazio)';
    if(finalVal !== ctx.node.label){ ctx.node.label = finalVal; changed = true; }
  }
  const wasNew = (id === pendingNewId);
  pendingNewId = null;
  if(changed || wasNew) snapshot(); else saveMaps();
  render();

  if(then === 'sibling') addSibling(id);
  else if(then === 'child') addChild(id);
  else positionActionBar();
}

function makeGhost(id){
  const ctx = findCtx(id);
  const g = document.createElement('div');
  g.className = 'ghost';
  g.textContent = ((ctx && ctx.node.label) || '(vazio)').split('\n')[0];
  document.body.appendChild(g);
  return g;

function clearDrop(){
  document.querySelectorAll('.node.drop-target').forEach(e => e.classList.remove('drop-target'));
  $('dropline').style.display = 'none';

viewport.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  closeMenus();
  finishTween();                       // interagir corta a animação em curso, sem deixar nada meio-caminho
  if(pointers.size >= 2){              // 2º dedo → pinça (zoom + pan com 2 dedos), cancela pan/drag de 1 dedo
    try{ viewport.setPointerCapture(e.pointerId); }catch(_){}
    pinchStart();
    return;
  }
  if(e.target.closest('#actionbar')) return;
  if(e.target.closest('.toggle')) return;
  if(e.target.closest('textarea.edit')) return;
  const nodeEl = e.target.closest('.node');
  if(nodeEl){
    cand = { id:nodeEl.dataset.id, x:e.clientX, y:e.clientY, moved:false, target:null };
    viewport.setPointerCapture(e.pointerId);
    return;
  }
  if(editingId != null) commitEdit(false);
  pan = { x:e.clientX, y:e.clientY, ox:panX, oy:panY, moved:false };
  viewport.classList.add('panning');
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pinch){ pinchMove(); return; }
  // modo Repo (só leitura): começar a arrastar EM CIMA de um nó vira arrasto da TELA
  // (não dá pra reordenar; clique parado no nó ainda seleciona — o `cand` só vira `pan` se mover)
  if(readOnly && cand && !pan && Math.hypot(e.clientX - cand.x, e.clientY - cand.y) > 4){
    pan = { x: cand.x, y: cand.y, ox: panX, oy: panY, moved: true };
    cand = null;
    viewport.classList.add('panning');
  }
  if(pan){
    panX = pan.ox + (e.clientX - pan.x);
    panY = pan.oy + (e.clientY - pan.y);
    if(Math.hypot(e.clientX - pan.x, e.clientY - pan.y) > 3) pan.moved = true;
    applyTransform(); positionActionBar();
    return;
  }
  if(cand && !readOnly){
    if(!cand.moved && Math.hypot(e.clientX - cand.x, e.clientY - cand.y) > 5){
      cand.moved = true;
      const el = els.get(cand.id); if(el) el.classList.add('dragging');
      ghost = makeGhost(cand.id);
    }
    if(cand.moved && ghost){
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';
      clearDrop();
      cand.target = null; cand.mode = null;

      // nó mais próximo do cursor (distância à caixa; 0 se dentro), ignorando o próprio e descendentes
      const r = viewport.getBoundingClientRect();
      const mx = e.clientX, my = e.clientY;
      let best = null, bestD = Infinity;
      LAYOUT.forEach((it, id) => {
        if(id === cand.id || isDescendant(cand.id, id)) return;
        const sx = r.left + panX + it.x * zoom, sy = r.top + panY + it.y * zoom;
        const sw = it.w * zoom, sh = it.h * zoom;
        const dx = Math.max(sx - mx, 0, mx - (sx + sw));
        const dy = Math.max(sy - my, 0, my - (sy + sh));
        const d = Math.hypot(dx, dy);
        if(d < bestD){ bestD = d; best = { id, sx, sy, sw, sh }; }
      });
      if(best){
        const { id, sx, sy, sw, sh } = best;
        const tc = findCtx(id);
        const canSib = !!(tc && tc.parent);            // raiz não tem irmãos
        let mode;
        if(!canSib) mode = 'into';
        else if(my < sy) mode = 'before';              // acima da caixa → antes
        else if(my > sy + sh) mode = 'after';          // abaixo da caixa → depois
        else {                                         // dentro da caixa (vertical): terços
          const rel = (my - sy) / sh;
          mode = rel < 0.34 ? 'before' : rel > 0.66 ? 'after' : 'into';
        }
        cand.target = id; cand.mode = mode;
        if(mode === 'into'){
          const el = els.get(id); if(el) el.classList.add('drop-target');
        } else {
          const dl = $('dropline');
          dl.style.display = 'block';
          dl.style.left  = sx + 'px';
          dl.style.width = sw + 'px';
          dl.style.top   = (mode === 'before' ? sy - 2 : sy + sh - 1) + 'px';
        }
      }
    }
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pinch){
    try{ viewport.releasePointerCapture(e.pointerId); }catch(_){}
    if(pointers.size < 2){
      // pinça que durou pouco e quase não mudou o zoom = TOQUE de 2 dedos; guarda p/ ver se vem o par
      _pinchTapPending = (performance.now() - pinch.t0 < 260 && Math.abs(zoom - pinch.z0) < 0.03)
        ? { t: performance.now(), mx: pinch.mx0, my: pinch.my0 } : null;
      pinchEnd();
    }
    return;
  }
  // 2º dedo saindo logo depois do 1º, sem ter pinçado → toque de 2 dedos concluído
  if(_pinchTapPending && pointers.size === 0 && performance.now() - _pinchTapPending.t < 220){
    const tap = _pinchTapPending; _pinchTapPending = null;
    pan = null; viewport.classList.remove('panning');           // limpa o pan que o pinchEnd semeou
    const now = performance.now();
    if(_2fTapT && now - _2fTapT < 480){ _2fTapT = 0; twoFingerDblZoomOut(tap.mx, tap.my); }
    else _2fTapT = now;
    return;
  }
  if(pan){
    const wasClick = !pan.moved;
    pan = null; viewport.classList.remove('panning');
    try{ viewport.releasePointerCapture(e.pointerId); }catch(_){}
    if(wasClick && selectedId != null) setSelected(null);
    return;
  }
  if(cand){
    try{ viewport.releasePointerCapture(e.pointerId); }catch(_){}
    if(!cand.moved){
      const t = performance.now();
      if(_lastClick && _lastClick.id === cand.id && t - _lastClick.t < 450){
        _lastClick = null;
        startEdit(cand.id);                 // 2º clique no mesmo balão → editar
      } else {
        _lastClick = { id: cand.id, t };
        setSelected(cand.id);
      }
    } else {
      const el = els.get(cand.id); if(el) el.classList.remove('dragging');
      if(ghost){ ghost.remove(); ghost = null; }
      clearDrop();
      if(cand.target){
        if(cand.mode === 'into') reparent(cand.id, cand.target);
        else reorderNode(cand.id, cand.target, cand.mode);
      }
    }
    cand = null;
  }
}
function abortDrag(){          // Esc durante o arrasto: cancela sem mover nada
  const el = cand && els.get(cand.id); if(el) el.classList.remove('dragging');
  if(ghost){ ghost.remove(); ghost = null; }
  clearDrop();
  cand = null;
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if(ghost){ ghost.remove(); ghost = null; }
  clearDrop();
  const el = cand && els.get(cand.id); if(el) el.classList.remove('dragging');
  pan = null; cand = null; pinch = null; _pinchTapPending = null; viewport.classList.remove('panning');
});
// nós: duplo-clique tratado à mão em endPointer (_lastClick). Aqui só o resto:
viewport.addEventListener('dblclick', e => {
  // o duplo-clique que abre o editor troca .lbl por <textarea> no meio do gesto —
  // o e.target daqui pode cair num vão e escapar do closest('.node'). Se acabou de
  // entrar em edição (ou ainda está editando), o duplo-clique foi num nó: ignora.
  if(editingId != null) return;
  if(e.target.closest('.node') || e.target.closest('.toggle') || e.target.closest('textarea.edit')) return;
  // duplo-TOQUE (touch) no vazio → zoom IN suave em direção ao ponto. No desktop o zoom é pela roda do mouse.
  const touch = (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)
             || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  if(!touch) return;
  const r = viewport.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  transitionTo(null, () => {
    const nz = clamp(zoom * 1.5, 0.18, 3);
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;   // ponto do mundo sob o clique
    return { zoom: nz, panX: cx - wx * nz, panY: cy - wy * nz };
  }, 320);
});
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(f, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

function navigate(key){
  if(!selectedId) return;
  const ctx = findCtx(selectedId); if(!ctx) return;
  const { node, parent, index } = ctx;
  let target = null;
  if(key === 'ArrowRight'){
    if(node.children.length){
      if(node.collapsed){ toggleCollapse(selectedId); return; }
      target = node.children[0].id;
    }
  } else if(key === 'ArrowLeft'){
    if(node.children.length && !node.collapsed){ toggleCollapse(selectedId); return; }
    if(parent) target = parent.id;
  } else if(key === 'ArrowUp'){
    if(parent && index > 0) target = parent.children[index-1].id;
  } else if(key === 'ArrowDown'){
    if(parent && index < parent.children.length-1) target = parent.children[index+1].id;
  }
  if(target){ selectedId = target; render(); ensureVisible(target); }
}
document.addEventListener('keydown', e => {
  if(cand && cand.moved && e.key === 'Escape'){ e.preventDefault(); abortDrag(); return; }
  if(editingId != null) return;                       // textarea trata o seu
  const tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  // modo Repo (só leitura): só navegação, zoom, ajustar à tela e limpar seleção
  if(readOnly && !['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape',' ','+','=','-','_'].includes(e.key)) return;

  if(e.ctrlKey || e.metaKey){
    const k = e.key.toLowerCase();
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'y'){ e.preventDefault(); redo(); }
    else if(k === 's'){ e.preventDefault(); saveMaps(); toast('Salvo automaticamente'); }
    return;
  }
  if(e.altKey){
    if(selectedId && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
      e.preventDefault();
      moveSibling(selectedId, e.key === 'ArrowUp' ? -1 : 1);
    }
    return;
  }

  switch(e.key){
    case 'Tab':       e.preventDefault(); if(selectedId) addChild(selectedId); break;
    case 'Enter':     e.preventDefault(); if(selectedId) addSibling(selectedId); break;
    case 'F2':        if(selectedId) startEdit(selectedId); break;
    case 'Delete':
    case 'Backspace': e.preventDefault(); if(selectedId) removeNode(selectedId); break;
    case 'Escape':    selectedId = null; render(); positionActionBar(); break;
    case ' ':         e.preventDefault(); fitView(); break;
    case '+': case '=': zoomBy(1.12); break;
    case '-': case '_': zoomBy(1/1.12); break;
    case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight':
      e.preventDefault(); navigate(e.key); break;
  }
});

function exportJSON(){

  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }),
    safeName(maps[currentId].name) + '.mindmap.json');

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}
function exportPNG(){
  layout();
  const items = [...LAYOUT.values()];
  if(!items.length) return;
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  items.forEach(it => {
    minX = Math.min(minX, it.x); minY = Math.min(minY, it.y);
    maxX = Math.max(maxX, it.x + it.w); maxY = Math.max(maxY, it.y + it.h);
  });
  const pad = 46, scale = 2;
  const W = (maxX - minX) + pad*2, H = (maxY - minY) + pad*2;
  const cv = document.createElement('canvas');
  cv.width = W * scale; cv.height = H * scale;
  const g = cv.getContext('2d');
  g.scale(scale, scale);
  g.translate(-minX + pad, -minY + pad);

  const bodyCS = getComputedStyle(document.body);
  g.fillStyle = bodyCS.getPropertyValue('--canvas-bg').trim() || '#12131a';
  g.fillRect(minX - pad, minY - pad, W, H);

  g.lineWidth = 1.7;
  LAYOUT.forEach((it, id) => {
    const ctx = findCtx(id); if(!ctx || !ctx.parent) return;
    const p = LAYOUT.get(ctx.parent.id); if(!p) return;
    g.strokeStyle = bodyCS.getPropertyValue('--d' + Math.min(it.depth, 4) + 'b').trim() || '#5b68ad';
    const x1 = p.x + p.w, y1 = p.y + p.h/2, x2 = it.x, y2 = it.y + it.h/2, dx = x2 - x1;
    g.beginPath();
    g.moveTo(x1, y1);
    g.bezierCurveTo(x1 + dx*0.5, y1, x2 - dx*0.5, y2, x2, y2);
    g.stroke();
  });

  LAYOUT.forEach((it, id) => {
    const el = els.get(id); if(!el) return;
    const cs = getComputedStyle(el);
    roundRect(g, it.x, it.y, it.w, it.h, 10);
    g.fillStyle = cs.backgroundColor; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = cs.borderTopColor; g.stroke();
    const fs = parseFloat(cs.fontSize) || 13;
    g.fillStyle = cs.color;
    g.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
    g.textBaseline = 'middle';
    const ctx = findCtx(id);
    let lines = String((ctx && ctx.node.label) || '').split('\n');
    if(ctx && ctx.node.w){            // largura fixa: quebra por palavra, como no balão
      const maxW = it.w - 26, out = [];
      lines.forEach(ln => {
        let cur = '';
        ln.split(' ').forEach(wd => {
          const t = cur ? cur + ' ' + wd : wd;
          if(cur && g.measureText(t).width > maxW){ out.push(cur); cur = wd; } else cur = t;
        });
        out.push(cur);
      });
      lines = out;
    }
    const lh = fs * 1.4;
    let ty = it.y + it.h/2 - (lines.length - 1) * lh/2;
    lines.forEach(ln => { g.fillText(ln, it.x + 13, ty); ty += lh; });
  });

  cv.toBlob(b => downloadBlob(b, safeName(maps[currentId].name) + '.png'), 'image/png');
}

if(HOSTED) document.body.classList.add('hosted');
(function bootSource(){
  const qp = new URLSearchParams(location.search).get('maps');
  let saved = ''; try{ saved = localStorage.getItem('mm_source') || ''; }catch(_){}
  if(!HOSTED && saved === 'local' && !qp){
    source = 'local'; refreshSrcUI();
  } else {
    source = 'remote';                     // marca cedo p/ o bootFolder abaixo pular
    refreshSrcUI();
    loadRemote(qp || REMOTE_MAPS);
  }
})();

// reconecta uma pasta vinculada anteriormente (Chrome/Edge)
(async function bootFolder(){
  if(!FS_OK || source === 'remote') return;
  try{
    const h = await idbGet('dir');
    if(!h) return;
    dirHandle = h;
    let perm = 'prompt';
    try{ perm = await h.queryPermission({ mode:'readwrite' }); }catch(_){}
    if(perm === 'granted'){
      await syncFromDir();
      if(!maps[currentId]) currentId = Object.keys(maps)[0];
      tree = maps[currentId].tree; normalize(tree);
      resetHistory(); refreshMapSel(); selectedId = null; render(); fitView();
    } else {
      needsReconnect = true;
    }
  }catch(e){ console.warn('bootFolder', e); }
  updateFolderBtn();
})();

})();
</script>
