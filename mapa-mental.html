<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapa Mental — Estudo</title>
<style>
  /* ---------------------------------------------------------------------------
     Editor de mapa mental no estilo do NotebookLM (árvore horizontal, nós
     coloridos por profundidade, conectores curvos, recolher/expandir, zoom).
     Tudo local: salva em localStorage; exporta JSON e PNG.
  --------------------------------------------------------------------------- */
  :root{
    --canvas-bg:#12131a; --panel:#1b1d26; --panel-2:#242734; --text:#e6e8ef;
    --muted:#98a0b3; --border:#33374a; --accent:#6ea8fe; --danger:#e0596b;
    /* uma cor por nível: indigo → azul → teal → verde → verde claro.
       --dNb é também a cor do conector que CHEGA num nó de profundidade N */
    --d0:#3f3d56; --d0b:#5f5c86; --d0-text:#e9e7f6;
    --d1:#38406e; --d1b:#5b68ad;
    --d2:#2a5852; --d2b:#3f877a;
    --d3:#33603f; --d3b:#4f9560;
    --d4:#417a4a; --d4b:#65b079;
    --node-text:#e9f1ec;
    --c-rosa:#5f3552;     --c-rosa-b:#c76fae;
    --c-azul:#2f4a6d;     --c-azul-b:#4f7bb0;
    --c-roxo:#463a6b;     --c-roxo-b:#7160b4;
    --c-ambar:#6a5327;    --c-ambar-b:#ac8340;
    --c-vermelho:#6a2f39; --c-vermelho-b:#ab515e;
    --c-cinza:#3b3e4b;    --c-cinza-b:#5c6274;
  }
  /* tema fixo escuro — sem toggle de tema claro */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--canvas-bg); color:var(--text);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit}

  /* ---- barra superior ---- */
  #topbar{
    position:absolute; inset:0 0 auto 0; height:46px; z-index:30;
    display:flex; align-items:center; gap:6px; padding:0 10px;
    background:var(--panel); border-bottom:1px solid var(--border);
  }
  #topbar .brand{font-weight:700; letter-spacing:.2px; margin-right:6px; white-space:nowrap}
  #topbar .brand span{color:var(--accent)}
  #mapSel{
    max-width:220px; height:28px; padding:0 8px; border-radius:7px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
  }
  /* toggle Pasta | Repo (esquerda = pasta local que edita, direita = repo remoto só leitura) */
  #srcToggle{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font:11px/1 system-ui,sans-serif; white-space:nowrap}
  #srcToggle .st-lbl{color:var(--muted); transition:color .12s}
  #srcToggle.is-local  .st-lbl.l{color:var(--accent); font-weight:600}
  #srcToggle.is-remote .st-lbl.r{color:var(--accent); font-weight:600}
  #srcToggle .st-track{position:relative; width:32px; height:17px; border-radius:9px;
    background:var(--panel-2); border:1px solid var(--border)}
  #srcToggle .st-knob{position:absolute; top:1px; left:1px; width:13px; height:13px; border-radius:50%;
    background:var(--accent); transition:left .14s}
  #srcToggle.is-remote .st-knob{left:16px}
  /* o 📁 Pasta e o selo "somente leitura" ficam empilhados na MESMA célula e só trocam
     de visibility — assim o slot tem largura fixa (= o mais largo dos dois) e o toggle
     Pasta|Repo não se move ao alternar. Conteúdo à direita, sem vão sobrando depois. */
  #srcSlot{display:grid; align-items:center; justify-items:end; max-width:200px; overflow:hidden}
  #srcSlot>*{grid-area:1/1; min-width:0}
  #roTag{
    font:600 10px/1 system-ui,sans-serif; letter-spacing:.3px; white-space:nowrap;
    color:var(--warning); border:1px solid var(--warning); border-radius:6px; padding:3px 6px;
  }
  /* modo somente-leitura (fonte = Repo): esconde as ações que gravam */
  body.readonly [data-act="new"],
  body.readonly [data-act="rename"],
  body.readonly [data-act="dup"],
  body.readonly [data-act="del"],
  body.readonly [data-act="undo"],
  body.readonly [data-act="redo"],
  body.readonly [data-act="addchild"]{display:none}
  /* aberto via link (HOSTED): sem opção de Pasta — some o toggle e os separadores órfãos */
  body.hosted #srcToggle,
  body.hosted #srcSep,
  body.hosted #tbSep1{display:none}
  .tb{
    height:28px; padding:0 10px; border-radius:7px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .tb:hover{border-color:var(--accent); color:var(--accent)}
  .tb.icon{width:28px; padding:0; justify-content:center}
  .tb.icon svg{width:15px; height:15px; display:block}
  .tb:disabled{opacity:.4; cursor:default}
  .sep{width:1px; height:24px; background:var(--border); margin:0 3px}
  .spacer{flex:1}

  /* ---- área do mapa ---- */
  #viewport{
    position:absolute; inset:46px 0 0 0; overflow:hidden;
    cursor:grab; touch-action:none; user-select:none;
  }
  #viewport.panning{cursor:grabbing}
  #world{position:absolute; left:0; top:0; transform-origin:0 0}
  /* nós e conectores animam juntos por JS (transitionTo) — nada de transição CSS de posição aqui */
  #links{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  #links .lk{fill:none; stroke-width:1.7; stroke-linecap:round; vector-effect:non-scaling-stroke}
  #links .lk1{stroke:var(--d1b)}  /* conector que chega num nó de nível N usa a cor do nível N */
  #links .lk2{stroke:var(--d2b)}
  #links .lk3{stroke:var(--d3b)}
  #links .lk4{stroke:var(--d4b)}
  #links .lk5{stroke:var(--d4b)}

  .node{
    position:absolute; width:max-content; max-width:none; padding:9px 13px;
    border:1.5px solid var(--d1b); border-radius:10px;
    background:var(--d1); color:var(--node-text);
    white-space:pre; word-break:normal; overflow-wrap:normal;   /* só quebra onde tiver \n de propósito */
    box-shadow:0 1px 3px rgba(0,0,0,.28); cursor:default;
    transition:box-shadow .12s, outline-color .12s;
  }
  .node[data-depth="0"]{background:var(--d0); border-color:var(--d0b); color:var(--d0-text); font-weight:600}
  .node[data-depth="1"]{background:var(--d1); border-color:var(--d1b)}
  .node[data-depth="2"]{background:var(--d2); border-color:var(--d2b)}
  .node[data-depth="3"]{background:var(--d3); border-color:var(--d3b)}
  .node[data-depth="4"]{background:var(--d4); border-color:var(--d4b)}
  .node[data-color="rosa"]    {background:var(--c-rosa);     border-color:var(--c-rosa-b);     color:var(--node-text)}
  .node[data-color="azul"]    {background:var(--c-azul);     border-color:var(--c-azul-b);     color:var(--node-text)}
  .node[data-color="roxo"]    {background:var(--c-roxo);     border-color:var(--c-roxo-b);     color:var(--node-text)}
  .node[data-color="ambar"]   {background:var(--c-ambar);    border-color:var(--c-ambar-b);    color:var(--node-text)}
  .node[data-color="vermelho"]{background:var(--c-vermelho); border-color:var(--c-vermelho-b); color:var(--node-text)}
  .node[data-color="cinza"]   {background:var(--c-cinza);    border-color:var(--c-cinza-b);    color:var(--node-text)}
  .node.selected{outline:2px solid var(--accent); outline-offset:2px}
  /* largura fixada pelo usuário (node.w): quebra o texto sozinho dentro dela */
  .node.fixw{box-sizing:border-box; white-space:pre-wrap; overflow-wrap:anywhere}
  .node.fixw textarea.edit{white-space:pre-wrap; min-width:0}
  /* alça de largura: borda direita do balão selecionado (só modo Pasta) */
  /* área de pegar = borda + faixa interna dos pontinhos (cabe no padding de 13px, não muda a largura) */
  .rsz{position:absolute; top:0; bottom:0; right:-5px; width:16px; cursor:ew-resize; display:none; z-index:3}
  .rsz::after{content:""; position:absolute; top:50%; right:8px; width:6px; height:16px; margin-top:-8px;
    background-image:radial-gradient(circle,var(--accent) 1.2px,transparent 1.5px); background-size:6px 5.4px; opacity:.85}
  .rsz:hover::after{opacity:1; filter:brightness(1.3)}
  .node.selected > .rsz{display:block}
  body.readonly .rsz{display:none !important}
  .node.dragging{opacity:.35}
  .node.drop-target{outline:2px dashed var(--accent); outline-offset:2px}   /* soltar = vira filho */
  /* soltar entre irmãos: linha de inserção */
  #dropline{position:fixed; z-index:41; display:none; height:3px; border-radius:2px;
    background:var(--accent); pointer-events:none; box-shadow:0 0 7px var(--accent)}
  #dropline::before,#dropline::after{content:''; position:absolute; top:50%; width:7px; height:7px;
    border-radius:50%; background:var(--accent); transform:translateY(-50%)}
  #dropline::before{left:-3px} #dropline::after{right:-3px}
  .node .lbl{display:block; min-width:14px; min-height:1em}
  .node.enter{animation:nodeIn var(--enter-dur,.72s) cubic-bezier(.22,.61,.36,1)}   /* dur = ~0.96× a tween atual (JS seta --enter-dur) */
  /* só o fade — a POSIÇÃO do nó novo é animada pelo JS (transitionTo: sai de trás do pai e abre em leque) */
  @keyframes nodeIn{ from{opacity:0} to{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .node.enter{animation:none} }

  /* seta de recolher/expandir: círculo destacado, FORA do balão (como no NotebookLM) */
  .toggle{
    position:absolute; left:100%; top:50%; margin-left:7px;
    width:22px; height:22px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    cursor:pointer; z-index:3; transform:translateY(-50%);
    transition:background .12s, border-color .12s, color .12s;
  }
  .toggle:hover{border-color:var(--accent); color:var(--accent)}
  .toggle svg{width:12px; height:12px; display:block; transform-origin:50% 50%; transition:transform .5s cubic-bezier(.22,.61,.36,1)}
  .toggle[data-open="1"] svg{transform:rotate(180deg)}
  .toggle.pop{animation:tgPop .34s ease}
  @media (prefers-reduced-motion:reduce){ .toggle svg{transition:none} .toggle.pop{animation:none} }
  @keyframes tgPop{
    0%  {transform:translateY(-50%) scale(1);    box-shadow:0 0 0 0 rgba(110,168,254,.4)}
    45% {transform:translateY(-50%) scale(1.28); box-shadow:0 0 0 7px rgba(110,168,254,0)}
    100%{transform:translateY(-50%) scale(1);    box-shadow:0 0 0 0 rgba(110,168,254,0)}
  }

  /* ---- link de referências: ícone no canto superior direito do balão ---- */
  /* ícone só existe em nós COM referências, e só aparece no hover/seleção do nó */
  .reflink{
    position:absolute; top:-9px; right:-9px;
    width:19px; height:19px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--accent); color:var(--accent);
    cursor:pointer; z-index:4;
    opacity:0; pointer-events:none;
    transition:opacity .12s, background .12s, color .12s;
  }
  /* :not(:has(.toggle:hover)) — passar o mouse sobre o ">"/"<" (que é filho do .node) não revela o ícone */
  .node:hover:not(:has(> .toggle:hover)) > .reflink,
  .node.selected > .reflink,
  .node.refopen > .reflink{ opacity:.85; pointer-events:auto }
  .reflink:hover{ opacity:1; background:var(--accent); color:#fff }
  .reflink svg{width:11px; height:11px; display:block}

  /* ---- caixa de referências ---- */
  #refbox{
    position:fixed; z-index:46; display:none; flex-direction:column; gap:6px;
    min-width:236px; max-width:340px; padding:9px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 12px 34px rgba(0,0,0,.42); font-size:12px;
  }
  #refbox.open{display:flex}
  #refbox .rb-title{
    font:600 10px/1 system-ui,sans-serif; letter-spacing:.5px;
    text-transform:uppercase; color:var(--muted);
  }
  #refbox a.rb-item{
    display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:7px;
    color:var(--text); text-decoration:none;
    background:var(--panel-2); border:1px solid var(--border);
  }
  #refbox a.rb-item:hover{border-color:var(--accent); color:var(--accent)}
  #refbox a.rb-item.rb-item-warn{border-style:dashed; border-color:var(--muted)}
  #refbox .rb-kind{
    flex:none; font:600 8.5px/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.3px;
    color:var(--muted); border:1px solid var(--border); border-radius:4px;
    padding:2px 3px; min-width:24px; text-align:center;
  }
  #refbox .rb-kind-cf{color:var(--accent); border-color:var(--accent)}
  #refbox .rb-lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #refbox .rb-x{margin-left:auto; flex:none; color:var(--muted); padding:0 2px; font-size:12px}
  #refbox .rb-x:hover{color:var(--danger)}
  #refbox .rb-empty{color:var(--muted); padding:1px 2px}
  #refbox .rb-add{
    display:flex; flex-direction:column; gap:4px;
    border-top:1px solid var(--border); padding-top:7px;
  }
  #refbox .rb-add input{
    height:26px; padding:0 7px; border-radius:6px; font:inherit;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text); outline:none;
  }
  #refbox .rb-add input:focus{border-color:var(--accent)}
  #refbox .rb-add button{
    height:26px; border-radius:6px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  }
  #refbox .rb-add button:hover{border-color:var(--accent); color:var(--accent)}

  textarea.edit{
    display:block; min-width:120px; min-height:1.4em; resize:none;
    white-space:pre; overflow:hidden; field-sizing:content;   /* cresce com o texto, sem soft-wrap */
    font:inherit; color:inherit; background:rgba(0,0,0,.16);
    border:1px solid var(--accent); border-radius:6px; padding:4px 6px; outline:none;
  }

  /* ---- controles inferiores (canto direito, como no NotebookLM) ---- */
  #controls{
    position:absolute; right:16px; bottom:16px; z-index:30;
    display:flex; flex-direction:column; gap:8px;
  }
  .ctrl, .ctrl-group{
    background:var(--panel); border:1px solid var(--border); border-radius:9px;
    color:var(--text);
  }
  .ctrl{width:30px; height:30px; display:grid; place-items:center; cursor:pointer}
  .ctrl:hover{border-color:var(--accent); color:var(--accent)}
  .ctrl-group{display:flex; flex-direction:column; overflow:hidden}
  .ctrl-group button{
    width:30px; height:30px; border:0; background:transparent; color:inherit;
    display:grid; place-items:center; cursor:pointer;
  }
  .ctrl-group button:first-child{border-bottom:1px solid var(--border)}
  .ctrl-group button:hover{color:var(--accent)}
  .ctrl svg,.ctrl-group svg{width:15px; height:15px}

  #dlmenu{
    position:absolute; right:54px; bottom:16px; z-index:31;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:5px; display:flex; flex-direction:column; gap:2px; min-width:150px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #dlmenu button{
    text-align:left; padding:7px 10px; border:0; border-radius:7px;
    background:transparent; color:var(--text); cursor:pointer;
  }
  #dlmenu button:hover{background:var(--panel-2)}

  /* viewport estreita (celular em pé) OU baixa (celular deitado / janela do PC encolhida):
     os controles só DEITAM na horizontal — mesmo tamanho de botão do layout vertical.
     Media query de TAMANHO da viewport — reavalia sozinha ao redimensionar. */
  @media (max-width:640px), (max-height:480px){
    /* mesma base do #helpBtn (bottom:12px + safe-area) — os dois alinham embaixo */
    #controls{ flex-direction:row; bottom:calc(12px + env(safe-area-inset-bottom)) }
    .ctrl-group{ flex-direction:row }
    .ctrl-group button:first-child{ border-bottom:0; border-right:1px solid var(--border) }
    #dlmenu{                              /* abre ACIMA da barra, encostado à direita */
      right:16px; bottom:calc(12px + env(safe-area-inset-bottom) + 38px);
    }
  }

  /* ---- barra de ações do nó selecionado ---- */
  #actionbar{
    position:fixed; z-index:40; display:none; flex-direction:column; gap:4px;
    padding:4px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.34);
  }
  #actionbar .row{display:flex; gap:3px}
  #actionbar button{
    width:28px; height:28px; border:0; border-radius:7px; background:transparent;
    color:var(--text); cursor:pointer; display:grid; place-items:center;
  }
  #actionbar button:hover{background:var(--panel)}
  #actionbar button.danger:hover{background:var(--danger); color:#fff}
  #actionbar button.on{color:var(--accent)}
  #actionbar svg{width:15px; height:15px}
  #actionbar .sw{display:none; align-items:center; gap:4px; padding:2px 1px}
  #actionbar .sw.open{display:flex}
  #actionbar .sw-hint{font-size:9px; color:var(--muted); white-space:nowrap; padding:0 2px 0 3px; letter-spacing:.2px}
  #actionbar .sw button{
    width:20px; height:20px; border-radius:50%;
    border:1.5px solid rgba(128,128,128,.5);
    transition:transform .1s, border-color .1s;
  }
  #actionbar .sw button:hover{transform:scale(1.14); border-color:var(--accent)}
  /* prefixo #actionbar p/ vencer o `#actionbar button{background:transparent}` */
  #actionbar .sw button[data-sc="auto"]{background:repeating-linear-gradient(45deg,#8a8a8a,#8a8a8a 3px,#c6c6c6 3px,#c6c6c6 6px)}
  #actionbar .sw button[data-sc="rosa"]{background:var(--c-rosa-b)}
  #actionbar .sw button[data-sc="azul"]{background:var(--c-azul-b)}
  #actionbar .sw button[data-sc="roxo"]{background:var(--c-roxo-b)}
  #actionbar .sw button[data-sc="ambar"]{background:var(--c-ambar-b)}
  #actionbar .sw button[data-sc="vermelho"]{background:var(--c-vermelho-b)}
  #actionbar .sw button[data-sc="cinza"]{background:var(--c-cinza-b)}

  /* ---- dica + toast ---- */
  #helpBtn{
    position:absolute; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:25;
    width:30px; height:30px; border-radius:50%;                 /* bolinha (mesmo tamanho dos #controls) */
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    display:grid; place-items:center; cursor:pointer; font:700 14px/1 system-ui,sans-serif;
  }
  #helpBtn:hover{border-color:var(--accent); color:var(--accent)}
  #hint{
    position:absolute; left:12px; bottom:calc(52px + env(safe-area-inset-bottom)); z-index:25; display:none;
    padding:9px 24px 9px 11px;
    background:var(--panel); border:1px solid var(--border); border-radius:9px;
    font-size:11.5px; line-height:1.4;
  }
  #hint .hrow{display:flex; gap:7px; white-space:nowrap}
  #hint .hrow b{color:var(--text); font-weight:600; min-width:88px}
  #hint .hrow span{color:var(--muted)}
  #hint .hint-x{position:absolute; top:4px; right:5px; border:0; background:transparent;
    color:var(--muted); cursor:pointer; font-size:12px; line-height:1; padding:2px}
  #hint .hint-x:hover{color:var(--text)}
  #toast{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%) translateY(6px);
    z-index:45; padding:7px 15px; border-radius:20px; pointer-events:none;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    opacity:0; transition:opacity .18s, transform .18s;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .ghost{
    position:fixed; z-index:60; pointer-events:none; transform:translate(-50%,-50%);
    background:var(--panel-2); border:1.5px solid var(--accent); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; max-width:220px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92;
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Mapa <span>Mental</span></div>
  <select id="mapSel" title="Mapas salvos neste navegador"></select>
  <button class="tb" data-act="new">Novo</button>
  <button class="tb" data-act="rename">Renomear</button>
  <button class="tb" data-act="dup">Duplicar</button>
  <button class="tb" data-act="del">Excluir</button>
  <div class="sep" id="tbSep1"></div>
  <button class="tb icon" data-act="addchild" title="Adicionar nó ao selecionado (Tab)">+</button>
  <button class="tb icon" data-act="undo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
  <button class="tb icon" data-act="redo" title="Refazer (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg></button>
  <div class="spacer"></div>
  <span id="srcSlot">

<script>
(function(){
"use strict";

// ===========================================================================
//  Utilidades
// ===========================================================================
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => 'n' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const STORE = 'mm_v1';
const H_GAP = 66;   // folga horizontal "natural" depois da coluna (base do vão entre o ">" e os filhos)
// o vão real entre a borda direita do pai (onde fica o ">") e os filhos é clampado nesta faixa:
const H_GAP_MIN = 44;
const H_GAP_MAX = 100;
const V_GAP = 16;   // espaço vertical entre subárvores
const FS_OK = ('showDirectoryPicker' in window);
// aberto via link (GitHub Pages / servidor) x aberto direto (duplo-clique no arquivo).
// No link não faz sentido a "Pasta" (não há arquivos locais): trava em Repo e esconde o toggle.
// ?viewer=1 simula o modo link mesmo em file:// (p/ testar).
const HOSTED = location.protocol !== 'file:' || new URLSearchParams(location.search).has('viewer');
// chevron com bounding-box centrado em (12,12) — gira 180° sem "escorregar" no círculo
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L15 12 L9 18"/></svg>';
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>';
// fonte remota fixa (GitHub Pages do repo concurso-mapa-mental) — a pasta que tem index.json + os .json
const REMOTE_MAPS = 'https://ismailytm.github.io/concurso-mapa-mental/maps/';

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function safeName(s){
  return (s||'').replace(/[^\w\- À-ɏ]+/g,'').trim().replace(/\s+/g,'_') || 'mapa';
}

// ===========================================================================
//  Estado
// ===========================================================================
let maps = null, currentId = null, tree = null;
let zoom = 1, panX = 0, panY = 0;
let selectedId = null, editingId = null, pendingNewId = null;
let history = [], histIdx = -1;
let animateNext = false;   // anima a entrada dos nós no próximo layout (expandir / adicionar)
let _anchorRef = null;     // {id, y} — nó que deve ficar imóvel; o layout inteiro translada p/ mantê-lo
let dirHandle = null, needsReconnect = false;   // pasta vinculada (File System Access)
let source = 'local';          // 'local' (pasta, edita) | 'remote' (repo, só leitura)
let readOnly = false;          // true no modo remoto — bloqueia toda mutação/persistência
let remoteUrl = '';            // URL base do repo (com "/" no fim)
// Base p/ resolver refs de ARQUIVO (caminho relativo tipo "conteudo/slides/x.pdf") no modo Repo.
// É a pasta deste projeto no OneDrive/SharePoint (digivoxcombr-my) — o SharePoint serve o arquivo
// por caminho quando o navegador está logado no tenant. Já URL-encodada (%C3%A2 = â, %20 = espaço).
// Vai pro repo público, mas não expõe conteúdo: sem login, a URL só mostra a tela de autenticação.
// Override por dispositivo: localStorage['mm_ref_base'] (inclusive '' p/ desligar) ou ?refbase=<url>.
const REF_BASE_DEFAULT = 'https://digivoxcombr-my.sharepoint.com/personal/ismaily_mendes_smartspace_us/Documents/C%C3%A2mara%20dos%20Deputados/projetos/concursos/inss-df/';
let REF_BASE = REF_BASE_DEFAULT;
const els = new Map();     // id -> elemento .node
let LAYOUT = new Map();    // id -> {node,parent,depth,x,y,w,h}
let cand = null, pan = null, ghost = null;   // ponteiro
const pointers = new Map();   // pointerId -> {x,y} em coords de tela — p/ detectar pinça (2 dedos)
let pinch = null;             // {d0, mx0, my0, z0, panX0, panY0, t0} enquanto 2 dedos estão na tela
let _pinchTapPending = null;  // {t,mx,my} — a pinça terminou como TOQUE rápido (sem pinçar); aguarda o par
let _2fTapT = 0;              // timestamp do último toque de 2 dedos — 2 seguidos = duplo-toque → zoom OUT
let _lastClick = null;   // {id, t} — detecção própria de duplo-clique (mais tolerante que a nativa)

const viewport = $('viewport'), world = $('world'), bar = $('actionbar');
const LK = [1,2,3,4,5].map(d => $('links').querySelector('.lk' + d));   // path por nível

// ===========================================================================
//  Persistência / gestão de mapas
// ===========================================================================
function normalize(node){
  if(!node.id) node.id = uid();
  if(!Array.isArray(node.children)) node.children = [];
  if(node.collapsed !== true) delete node.collapsed;
  if(Array.isArray(node.refs)){
    node.refs = node.refs
      .filter(r => r && (r.url || r.href))
      .map(r => {
        const url = String(r.url || r.href).trim();
        return { label:String(r.label || r.url || r.href).trim(), url, kind: refKind(url, r.kind) };
      });
    if(!node.refs.length) delete node.refs;
  } else if(node.refs !== undefined){ delete node.refs; }
  if(!(node.w > 0)) delete node.w;
  node.children.forEach(normalize);
  return node;
}
function loadMaps(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE));
    if(raw && raw.maps && Object.keys(raw.maps).length){
      maps = raw.maps;
      currentId = (raw.currentId && maps[raw.currentId]) ? raw.currentId : Object.keys(maps)[0];
    }
  }catch(e){}
  if(!maps){
    const id = uid();
    maps = { [id]: { name:'Novo mapa', tree:normalize({ id:uid(), label:'Novo mapa', children:[] }), updatedAt:Date.now() } };
    currentId = id;
  }
  tree = normalize(maps[currentId].tree);
}
const saveMaps = (()=>{
  let t;
  return function(){
    if(readOnly) return;                 // modo Repo: nunca grava (localStorage nem pasta)
    clearTimeout(t);
    t = setTimeout(()=>{
      maps[currentId].tree = tree;
      maps[currentId].updatedAt = Date.now();
      try{ localStorage.setItem(STORE, JSON.stringify({maps, currentId})); }
      catch(e){ toast('Não foi possível salvar (armazenamento cheio?)'); }
      if(dirHandle && !needsReconnect) writeMapFile(currentId);
    }, 250);
  };
})();

// ---- pasta vinculada: cada mapa é um .json (Chrome/Edge, File System Access) ----
function _idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('mm-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await _idb();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v){
  const db = await _idb();
  return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
}
// nome de arquivo ideal para um mapa = título saneado + .json (com sufixo -2, -3… se colidir)
function fileNameFor(id){
  let base = safeName(maps[id].name || 'mapa'), want = base + '.json';
  for(let k = 2; Object.values(maps).some(m => m !== maps[id] && m.file === want); k++) want = base + '-' + k + '.json';
  return want;
}
async function writeMapFile(id){
  if(!dirHandle || needsReconnect || !maps[id]) return;
  try{
    let want = maps[id].file || fileNameFor(id);
    const ideal = fileNameFor(id);
    // mapa renomeado → tenta renomear o arquivo junto, via move() atômico (sem apagar+recriar).
    // Se move não existir / falhar (Firefox, OneDrive travado…), mantém o nome atual.
    if(maps[id].file && maps[id].file !== ideal){
      try{
        const h = await dirHandle.getFileHandle(maps[id].file);
        if(typeof h.move === 'function'){ await h.move(ideal); want = ideal; }
      }catch(_){}
    }
    const fh = await dirHandle.getFileHandle(want, { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ app:'mapa-mental', version:1, id, name:maps[id].name, tree:maps[id].tree }, null, 2));
    await w.close();
    maps[id].file = want;
  }catch(e){ console.warn('writeMapFile', e); }
}
async function removeMapFile(id){
  if(dirHandle && !needsReconnect && maps[id] && maps[id].file){
    try{ await dirHandle.removeEntry(maps[id].file); }catch(_){}
  }
}
async function syncFromDir(){
  if(!dirHandle) return 0;
  let count = 0;
  try{
    for await (const [name, h] of dirHandle.entries()){
      if(h.kind !== 'file' || !/\.json$/i.test(name)) continue;
      try{
        const f = await h.getFile();
        const d = JSON.parse(await f.text());
        if(!d || typeof d !== 'object' || !d.tree) continue;
        const id = d.id || ('file:' + name);
        maps[id] = { name: d.name || name.replace(/\.json$/i, ''), tree: normalize(d.tree),
                     updatedAt: f.lastModified || Date.now(), file: name };
        count++;
      }catch(_){}
    }
  }catch(e){ console.warn('syncFromDir', e); }
  return count;
}
async function linkFolder(){
  // id:'mm-notebook' → o navegador reabre na última pasta escolhida; startIn no handle anterior crava nela
  const base = { id:'mm-notebook', mode:'readwrite' };
  const prev = dirHandle;
  try{
    dirHandle = await window.showDirectoryPicker(prev ? { ...base, startIn: prev } : base);
  }catch(e){
    if(e && e.name === 'AbortError'){ dirHandle = prev; return; }
    try{ dirHandle = await window.showDirectoryPicker(base); }   // startIn inválido? tenta sem
    catch(e2){
      if(e2 && e2.name !== 'AbortError'){ toast('Sem acesso a pastas neste navegador/contexto — use Baixar → JSON'); }
      dirHandle = e2 && e2.name === 'AbortError' ? prev : null;
      return;
    }
  }
  needsReconnect = false;
  try{ await idbSet('dir', dirHandle); }catch(_){}

  // trocar de pasta = trocar de acervo: descarta o que veio da pasta anterior
  // (senão os mapas da pasta antiga continuam na lista — e o loop abaixo os copiaria pra nova).
  const switching = !!prev;
  if(switching) maps = {};

  const found = await syncFromDir();

  if(switching){
    if(!Object.keys(maps).length){
      const id = uid();
      maps[id] = { name:'Novo mapa', tree:normalize({ id:uid(), label:'Novo mapa', children:[] }), updatedAt:Date.now() };
    }
    currentId = Object.keys(maps)[0];
  } else {
    // primeiro vínculo: adota os mapas atuais (do navegador) na pasta escolhida
    for(const id in maps){ if(!maps[id].file) await writeMapFile(id); }
    if(!maps[currentId]) currentId = Object.keys(maps)[0];
  }
  tree = maps[currentId].tree; normalize(tree);
  resetHistory(); refreshMapSel(); selectedId = null; render(); fitView(); updateFolderBtn(); saveMaps();
  toast(found ? ('Pasta "' + dirHandle.name + '" · ' + found + ' arquivo(s) carregado(s)')
              : ('Pasta "' + dirHandle.name + '" vinculada'));
}
async function reconnectFolder(){
  if(!dirHandle) return;
  try{
    const p = await dirHandle.requestPermission({ mode:'readwrite' });
    if(p !== 'granted') return;
    needsReconnect = false;
    await syncFromDir();
    if(!maps[currentId]) currentId = Object.keys(maps)[0];
    tree = maps[currentId].tree; normalize(tree);
    resetHistory(); refreshMapSel(); render(); fitView(); updateFolderBtn();
    toast('Pasta reconectada');
  }catch(e){ console.warn('reconnectFolder', e); }
}
function updateFolderBtn(){
  const b = $('folderBtn'); if(!b) return;
  if(!FS_OK){ b.textContent = 'Baixar JSON'; b.title = 'Baixar o mapa atual como .json'; return; }
  if(dirHandle && needsReconnect){ b.textContent = '📁 Reconectar'; b.title = 'Reautorizar o acesso à pasta vinculada'; }
  else if(dirHandle){ b.textContent = '📁 ' + dirHandle.name;
    b.title = 'Cada mapa é salvo como .json na pasta "' + dirHandle.name + '". Clique para trocar de pasta.'; }
  else { b.textContent = '📁 Pasta…'; b.title = 'Escolher uma pasta (ex.: notebook) para salvar os mapas como .json'; }
}

// ===========================================================================
//  Fonte REMOTA (repo) — só leitura: baixa index.json + cada mapa via HTTP
// ===========================================================================
function refreshSrcUI(){
  const remote = source === 'remote';
  const t = $('srcToggle');
  if(t){ t.classList.toggle('is-remote', remote); t.classList.toggle('is-local', !remote); }
  const fb = $('folderBtn'); if(fb) fb.style.visibility = remote ? 'hidden' : 'visible';
  const rt = $('roTag'); if(rt) rt.style.visibility = readOnly ? 'visible' : 'hidden';
  document.body.classList.toggle('readonly', readOnly);
}
async function loadRemote(base){
  base = (base || REMOTE_MAPS).trim();
  if(!/\/$/.test(base)) base += '/';
  try{
    const ir = await fetch(base + 'index.json', { cache:'no-store' });
    if(!ir.ok) throw new Error('index.json (' + ir.status + ')');
    let list = await ir.json();
    if(!Array.isArray(list)) throw new Error('index.json não é uma lista');
    list = list.filter(n => typeof n === 'string' && /\.json$/i.test(n));
    const loaded = {};
    for(const name of list){
      try{
        const r = await fetch(base + name.split('/').map(encodeURIComponent).join('/'), { cache:'no-store' });
        if(!r.ok) continue;
        const d = await r.json();
        if(!d || typeof d !== 'object' || !d.tree) continue;
        const id = d.id || ('remote:' + name);
        loaded[id] = { name: d.name || name.replace(/\.json$/i,''), tree: normalize(d.tree), file: name, updatedAt: Date.now() };
      }catch(_){}
    }
    if(!Object.keys(loaded).length) throw new Error('nenhum mapa válido em ' + base);
    remoteUrl = base;
    try{ localStorage.setItem('mm_source', 'remote'); }catch(_){}
    if(editingId) commitEdit(false);
    source = 'remote'; readOnly = true;
    dirHandle = null; needsReconnect = false;          // solta a pasta em memória
    maps = loaded; currentId = Object.keys(maps)[0];
    tree = maps[currentId].tree;
    selectedId = null; editingId = null; pendingNewId = null;
    resetHistory(); refreshSrcUI(); refreshMapSel(); render(); fitView();
    toast('Repo: ' + Object.keys(loaded).length + ' mapa(s) carregado(s)');
  }catch(e){
    toast('Falha ao carregar o repo — ' + e.message);
    if(!readOnly && !HOSTED){                     // nunca entrou em Repo e não é via link → volta pra Pasta
      source = 'local';
      try{ localStorage.setItem('mm_source', 'local'); }catch(_){}
      refreshSrcUI(); updateFolderBtn();
    }
  }
}
function exitRemote(){
  source = 'local'; readOnly = false; remoteUrl = '';
  try{ localStorage.setItem('mm_source', 'local'); }catch(_){}
  maps = null; currentId = null;                        // descarta os mapas do repo
  loadMaps();                                           // reconstrói maps/currentId/tree do localStorage
  normalize(tree); resetHistory();
  selectedId = null; editingId = null;
  refreshSrcUI(); refreshMapSel(); render(); fitView(); updateFolderBtn();
  reconnectIfLinked();
}
async function reconnectIfLinked(){
  if(!FS_OK || source === 'remote') return;
  try{
    const h = await idbGet('dir'); if(!h) return;
    dirHandle = h;
    let perm = 'prompt';
    try{ perm = await h.queryPermission({ mode:'readwrite' }); }catch(_){}
    if(perm === 'granted'){
      await syncFromDir();
      if(!maps[currentId]) currentId = Object.keys(maps)[0];
      tree = maps[currentId].tree; normalize(tree);
      resetHistory(); refreshMapSel(); render(); fitView();
    } else { needsReconnect = true; }
  }catch(_){}
  updateFolderBtn();
}
function refreshMapSel(){
  const sel = $('mapSel'); sel.innerHTML = '';
  Object.keys(maps).forEach(id=>{
    const o = document.createElement('option');
    o.value = id; o.textContent = maps[id].name || '(sem nome)';
    sel.appendChild(o);
  });
  sel.value = currentId;
  document.title = (maps[currentId].name || 'Mapa Mental') + ' — Mapa Mental';
}
function resetHistory(){ history = [JSON.stringify(tree)]; histIdx = 0; }

function switchMap(id){
  if(!maps[id]) return;
  if(editingId) commitEdit(false);
  currentId = id; tree = normalize(maps[id].tree);
  selectedId = null; editingId = null; pendingNewId = null;
  resetHistory(); refreshMapSel(); render(); fitView(); saveMaps();
}
function newMap(){
  if(readOnly) return;
  const name = (prompt('Nome do novo mapa:', 'Novo mapa') || '').trim();
  if(name === '') return;
  const id = uid();
  maps[id] = { name, tree:normalize({ id:uid(), label:name, children:[] }), updatedAt:Date.now() };
  currentId = id; tree = maps[id].tree;
  selectedId = tree.id; resetHistory(); refreshMapSel(); render(); fitView();
  startEdit(tree.id); saveMaps();
  if(dirHandle && !needsReconnect) writeMapFile(id);
}
function renameMap(){
  if(readOnly) return;
  const name = (prompt('Renomear mapa:', maps[currentId].name) || '').trim();
  if(name === '') return;
  maps[currentId].name = name; refreshMapSel(); saveMaps();
}
function dupMap(){
  if(readOnly) return;
  const clone = j => {
    const o = { id:uid(), label:j.label, children:(j.children||[]).map(clone) };
    if(j.color) o.color = j.color;
    if(j.collapsed) o.collapsed = j.collapsed;
    if(j.refs && j.refs.length) o.refs = j.refs.map(r => ({ label:r.label, url:r.url, kind:refKind(r.url, r.kind) }));
    return o;
  };
  const id = uid();
  maps[id] = { name:maps[currentId].name + ' (cópia)', tree:clone(tree), updatedAt:Date.now() };
  currentId = id; tree = maps[id].tree; selectedId = null;
  resetHistory(); refreshMapSel(); render(); fitView(); saveMaps();
  if(dirHandle && !needsReconnect) writeMapFile(id);
  toast('Mapa duplicado');
}
function delMap(){
  if(readOnly) return;
  if(!confirm('Excluir o mapa "' + (maps[currentId].name||'') + '"? Esta ação não pode ser desfeita.')) return;
  removeMapFile(currentId);
  delete maps[currentId];
  const ids = Object.keys(maps);
  if(!ids.length){
    const id = uid();
    maps[id] = { name:'Novo mapa', tree:normalize({ id:uid(), label:'Novo mapa', children:[] }), updatedAt:Date.now() };
    currentId = id;
  } else currentId = ids[0];
  tree = normalize(maps[currentId].tree); selectedId = null;
  resetHistory(); refreshMapSel(); render(); fitView(); saveMaps();
}

// ===========================================================================
//  Operações na árvore
// ===========================================================================
function findCtx(id, node, parent, index){
  node = node || tree; parent = parent || null; index = index==null ? -1 : index;
  if(node.id === id) return { node, parent, index };
  for(let i=0;i<node.children.length;i++){
    const r = findCtx(id, node.children[i], node, i);
    if(r) return r;
  }
  return null;
}
function walk(node, fn, depth, parent){
  depth = depth||0; parent = parent||null;
  fn(node, parent, depth);
  node.children.forEach(c => walk(c, fn, depth+1, node));
}
function countDesc(node){ let n = -1; walk(node, ()=>n++); return n; }
function isDescendant(ancestorId, maybeId){
  const c = findCtx(ancestorId);
  return !!(c && findCtx(maybeId, c.node));
}
function visibleList(){
  const out = [];
  (function rec(node, parent, depth){
    out.push({ node, parent, depth, id:node.id });
    if(!node.collapsed) node.children.forEach(c => rec(c, node, depth+1));
  })(tree, null, 0);
  return out;
}

function snapshot(){
  if(readOnly) return;                   // sem histórico/persistência no modo Repo
  const s = JSON.stringify(tree);
  if(history[histIdx] === s) return;
  history = history.slice(0, histIdx+1);
  history.push(s);
  if(history.length > 80) history.shift();
  histIdx = history.length - 1;
  saveMaps();
}
function restore(idx){
  histIdx = idx;
  tree = normalize(JSON.parse(history[histIdx]));
  maps[currentId].tree = tree;
  if(selectedId && !findCtx(selectedId)) selectedId = null;
  editingId = null; pendingNewId = null;
  render(); positionActionBar(); saveMaps();
}
function undo(){ if(readOnly) return; if(histIdx > 0) restore(histIdx - 1); }
function redo(){ if(readOnly) return; if(histIdx < history.length - 1) restore(histIdx + 1); }

function addChild(parentId){
  if(readOnly) return;
  const ctx = findCtx(parentId); if(!ctx) return;
  delete ctx.node.collapsed;
  const node = { id:uid(), label:'', children:[] };
  ctx.node.children.push(node);
  pendingNewId = node.id; selectedId = node.id;
  animateNext = true;
  render(); ensureVisible(node.id); startEdit(node.id);
}
function addSibling(nodeId){
  if(readOnly) return;
  const ctx = findCtx(nodeId);
  if(!ctx || !ctx.parent) return addChild(nodeId);
  const node = { id:uid(), label:'', children:[] };
  ctx.parent.children.splice(ctx.index+1, 0, node);
  pendingNewId = node.id; selectedId = node.id;
  animateNext = true;
  render(); ensureVisible(node.id); startEdit(node.id);
}
function removeNode(id){
  if(readOnly) return;
  const ctx = findCtx(id);
  if(!ctx || !ctx.parent){ toast('A raiz não pode ser excluída'); return; }
  const n = countDesc(ctx.node);
  if(n > 0 && !confirm('Excluir este nó e os ' + n + ' descendentes?')) return;
  ctx.parent.children.splice(ctx.index, 1);
  selectedId = ctx.parent.id; editingId = null; pendingNewId = null;
  snapshot(); render(); positionActionBar();
}
function moveSibling(id, dir){
  if(readOnly) return;
  const ctx = findCtx(id); if(!ctx || !ctx.parent) return;
  const arr = ctx.parent.children, i = ctx.index, j = i + dir;
  if(j < 0 || j >= arr.length) return;
  transitionTo(() => { arr.splice(j, 0, arr.splice(i, 1)[0]); snapshot(); });
  positionActionBar();
}
function reparent(srcId, tgtId){
  if(readOnly) return;
  if(srcId === tgtId || isDescendant(srcId, tgtId)) return;
  const s = findCtx(srcId); if(!s || !s.parent) return;
  const t = findCtx(tgtId); if(!t) return;
  selectedId = srcId; animateNext = true;
  transitionTo(() => {
    _anchorRef = null;
    s.parent.children.splice(s.index, 1);
    delete t.node.collapsed;
    t.node.children.push(s.node);
    snapshot();
  });
  positionActionBar();
}
// solta ENTRE irmãos: move srcId p/ antes/depois de refId, no mesmo pai de refId
function reorderNode(srcId, refId, pos){
  if(readOnly) return;
  if(srcId === refId || isDescendant(srcId, refId)) return;
  const s = findCtx(srcId), r = findCtx(refId);
  if(!s || !s.parent || !r || !r.parent) return;   // refId precisa ter pai (não a raiz)
  selectedId = srcId; animateNext = true;
  transitionTo(() => {
    _anchorRef = null;
    s.parent.children.splice(s.index, 1);
    const rc = findCtx(refId);                      // re-localiza: índices podem ter mudado
    rc.parent.children.splice(rc.index + (pos === 'after' ? 1 : 0), 0, s.node);
    snapshot();
  });
  positionActionBar();
}
function toggleCollapse(id){
  const ctx = findCtx(id); if(!ctx || !ctx.node.children.length) return;
  const willExpand = !!ctx.node.collapsed;
  transitionTo(() => {
    _anchorRef = { id, y: (POS.get(id) || { y:0 }).y };   // fixa ESTE balão nesta posição
    if(ctx.node.collapsed){ delete ctx.node.collapsed; animateNext = true; }
    else ctx.node.collapsed = true;
    snapshot();
  }, () => {
    // câmera no zoom de foco (desktop FOCUS_ZOOM · mobile FOCUS_ZOOM_MOBILE): recolher → só o nó.
    // expandir: desktop → nó + filhos diretos (recua p/ caber);
    //           mobile  → do ">" do pai até os filhos, zoom TRAVADO (não recua); alinhado à esquerda
    //                     (linha longa transborda), e se não couberem na altura o 1º filho fica no topo.
    const it = LAYOUT.get(id); if(!it) return null;
    const TG = 32;
    const r = viewport.getBoundingClientRect();
    const mobile = r.width <= 640 || r.height <= 480;
    const fz = mobile ? FOCUS_ZOOM_MOBILE : FOCUS_ZOOM;
    if(!willExpand) return frameBox(it.x, it.y, it.w + TG, it.h, fz);
    // desktop: bbox inclui a caixa do pai. mobile: começa no ">" (borda direita do pai), sem a caixa dele.
    let x0 = mobile ? it.x + it.w : it.x, y0, x1, y1, has = false;
    if(!mobile){ y0 = it.y; x1 = it.x + it.w; y1 = it.y + it.h; has = true; }
    ctx.node.children.forEach(c => {
      const ci = LAYOUT.get(c.id); if(!ci) return;
      const cX1 = ci.x + ci.w + (c.children && c.children.length ? TG : 0);
      if(!has){ y0 = ci.y; x1 = cX1; y1 = ci.y + ci.h; has = true; }
      else { x0 = Math.min(x0, ci.x); y0 = Math.min(y0, ci.y); x1 = Math.max(x1, cX1); y1 = Math.max(y1, ci.y + ci.h); }
    });
    if(!has) return frameBox(it.x, it.y, it.w + TG, it.h, fz);   // defensivo: sem filhos visíveis
    if(mobile) return frameBox(x0, y0, x1 - x0, y1 - y0, fz, { exact: true, anchorLeft: true, topWhenTall: true });
    return frameBox(x0, y0, x1 - x0, y1 - y0, fz);
  });
  positionActionBar();
}
// nós afetados por uma cor: só o nó · Shift = + descendentes · Alt = irmãos · Shift+Alt = irmãos + ramos
function colorTargets(id, opts){
  const ctx = findCtx(id); if(!ctx) return [];
  const roots = (opts.siblings && ctx.parent) ? ctx.parent.children : [ctx.node];
  const out = [];
  roots.forEach(r => opts.deep ? walk(r, n => out.push(n)) : out.push(r));
  return out;
}
function setColor(id, key, opts){
  if(readOnly) return;
  opts = opts || {};
  const ctx = findCtx(id); if(!ctx) return;
  const roots = (opts.siblings && ctx.parent) ? ctx.parent.children.slice() : [ctx.node];
  colorTargets(id, opts).forEach(n => { if(key && key !== 'auto') n.color = key; else delete n.color; });
  snapshot(); render();
  if(opts.siblings) toast('Cor aplicada aos ' + roots.length + ' irmãos' + (opts.deep ? ' (com ramos)' : ''));
  else if(opts.deep) toast('Cor aplicada ao ramo (' + countDesc(ctx.node) + ' descendentes)');
}
function toggleAll(){
  let anyExpanded = false;
  walk(tree, (n,p,d)=>{ if(d>0 && n.children.length && !n.collapsed) anyExpanded = true; });
  const collapsing = anyExpanded;
  transitionTo(() => {
    // fixa a RAIZ na posição visual atual: sem isso o `ly()` recentra a árvore inteira num novo
    // eixo Y (a raiz "pula" de y≈0 pro meio da árvore expandida), e aí nós+câmera se movem em
    // sentidos que se somam → a tela "desce e volta". Com a raiz fixa, tudo abre/fecha em volta dela.
    _anchorRef = { id: tree.id, y: (POS.get(tree.id) || { y: 0 }).y };
    walk(tree, (n,p,d)=>{ if(d>0 && n.children.length){ if(collapsing) n.collapsed = true; else delete n.collapsed; } });
    if(!collapsing) animateNext = true;   // .enter (fade) nos nós que aparecem
    snapshot();
  }, fitTarget, TWEEN_MS_ALL);   // câmera anima até "ajustar à tela" junto com os nós, mais devagar
}

// ===========================================================================
//  Referências por nó (ícone no canto do balão → caixa com links)
// ===========================================================================
const refbox = $('refbox');
let refOpenId = null;
const _rbEsc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const isAbsUrl = u => /^(https?:)?\/\//i.test(u) || /^(mailto:|tel:|data:)/i.test(u);
// caminho relativo (conteudo/…): modo Repo + REF_BASE definida → resolve na base (OneDrive);
// modo Pasta, ou sem base → devolve o relativo (abre o arquivo ao lado do mapa-mental.html)
function resolveRefUrl(u){
  u = String(u || '').trim();
  if(!u || isAbsUrl(u)) return u;
  if(source === 'remote' && REF_BASE) return REF_BASE.replace(/\/+$/, '') + '/' + u.replace(/^\/+/, '');
  return u;
}
function refKind(u, explicit){
  if(explicit) return explicit;
  u = String(u || '').toLowerCase();
  if(/planalto\.gov\.br|\/constituicao/.test(u)) return 'cf';
  if(/\/slides?\//.test(u) || /_slide\.pdf$/.test(u)) return 'slide';
  if(/\/figuras?\//.test(u)) return 'figura';
  if(/\.docx?$/.test(u)) return 'docx';
  if(/\/resumo\//.test(u) || /_(resumo|bolso)\.pdf$/.test(u)) return 'resumo';
  if(isAbsUrl(u)) return 'web';
  return 'file';
}
const REF_KIND_TAG = { cf:'CF', slide:'SL', figura:'FIG', docx:'DOC', resumo:'RES', web:'WEB', file:'—' };

function openRefBox(id, anchorEl){
  const ctx = findCtx(id); if(!ctx){ closeRefBox(); return; }
  refOpenId = id;
  document.querySelectorAll('.node.refopen').forEach(e => e.classList.remove('refopen'));
  const _el0 = els.get(id); if(_el0) _el0.classList.add('refopen');
  const refs = ctx.node.refs || [];
  let html = '<div class="rb-title">Referências</div>';
  html += refs.length
    ? refs.map((r,i) => {
        const href = resolveRefUrl(r.url);
        const k = refKind(r.url, r.kind);
        // relativo, modo Repo, sem base, e a página NÃO é file:// → não vai alcançar o arquivo
        const needsBase = source === 'remote' && !REF_BASE && !isAbsUrl(r.url) && location.protocol !== 'file:';
        return '<a class="rb-item' + (needsBase ? ' rb-item-warn' : '') + '" href="' + _rbEsc(href) +
            '" target="_blank" rel="noopener" title="' + _rbEsc(needsBase
              ? 'Defina a Base das referências (botão ?) p/ abrir do navegador — ' + r.url
              : href) + '">' +
          '<span class="rb-kind rb-kind-' + k + '">' + (REF_KIND_TAG[k] || '') + '</span>' +
          '<span class="rb-lbl">' + _rbEsc(r.label) + '</span>' +
          (readOnly ? '' : '<span class="rb-x" data-i="' + i + '" title="Remover">&#10005;</span>') +
        '</a>';
      }).join('')
    : '<div class="rb-empty">' + (readOnly ? 'Sem referências.' : 'Nenhuma referência ainda.') + '</div>';
  if(!readOnly) html +=
    '<div class="rb-add">' +
      '<input class="rb-lbl-in" type="text" placeholder="Título (ex.: CF art. 1º · Slide aula 4)">' +
      '<input class="rb-url-in" type="text" placeholder="URL ou caminho (https://… · conteudo/slides/…)">' +
      '<button class="rb-add-btn">Adicionar</button>' +
    '</div>';
  refbox.innerHTML = html;
  refbox.classList.add('open');

  const b = anchorEl.getBoundingClientRect();
  refbox.style.left = '0px'; refbox.style.top = '0px';
  const bw = refbox.offsetWidth, bh = refbox.offsetHeight;
  let left = b.right - bw, top = b.bottom + 6;
  if(top + bh > window.innerHeight - 8) top = b.top - bh - 6;
  refbox.style.left = clamp(left, 8, window.innerWidth - bw - 8) + 'px';
  refbox.style.top  = clamp(top, 8, window.innerHeight - bh - 8) + 'px';

  if(!readOnly){
    const lblIn = refbox.querySelector('.rb-lbl-in');
    const urlIn = refbox.querySelector('.rb-url-in');
    const doAdd = () => {
      const url = urlIn.value.trim(); if(!url){ urlIn.focus(); return; }
      addRef(id, lblIn.value.trim() || url, url);
    };
    refbox.querySelector('.rb-add-btn').addEventListener('click', doAdd);
    urlIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
    lblIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); urlIn.focus(); } });
    refbox.querySelectorAll('.rb-x').forEach(x => x.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      removeRef(id, +x.dataset.i);
    }));
  }
}
function closeRefBox(){
  if(refOpenId == null) return;
  const _el0 = els.get(refOpenId); if(_el0) _el0.classList.remove('refopen');
  refOpenId = null;
  refbox.classList.remove('open');
  refbox.innerHTML = '';
}
function _reopenRefBox(id){
  if(!findCtx(id)){ closeRefBox(); return; }
  const el = els.get(id);
  const anchor = (el && el.querySelector('.reflink'))
    || (selectedId === id && bar.style.display !== 'none' ? bar.querySelector('[data-a="ref"]') : null);
  if(anchor) openRefBox(id, anchor); else closeRefBox();
}
function addRef(id, label, url){
  if(readOnly) return;
  const ctx = findCtx(id); if(!ctx) return;
  if(!Array.isArray(ctx.node.refs)) ctx.node.refs = [];
  ctx.node.refs.push({ label, url, kind: refKind(url) });
  snapshot(); render(); _reopenRefBox(id);
}
function removeRef(id, i){
  if(readOnly) return;
  const ctx = findCtx(id); if(!ctx || !ctx.node.refs) return;
  ctx.node.refs.splice(i, 1);
  if(!ctx.node.refs.length) delete ctx.node.refs;
